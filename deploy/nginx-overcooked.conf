# Reverse proxy nginx pour Overcooked-coop-voice.
# À placer dans /etc/nginx/sites-available/overcooked puis lier dans sites-enabled.
# Remplacer overcooked.exemple.fr par le FQDN réel. `certbot --nginx` injectera/réécrira
# automatiquement les directives TLS (ce gabarit montre l'état post-certbot).

# --- HTTP : rediriger vers HTTPS (+ défi ACME pour le renouvellement) ---
server {
    listen 80;
    listen [::]:80;
    server_name overcooked.exemple.fr;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS : terminaison TLS, proxy vers gunicorn/eventlet (127.0.0.1:5000) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name overcooked.exemple.fr;

    # Géré par certbot (après : certbot --nginx -d overcooked.exemple.fr)
    ssl_certificate     /etc/letsencrypt/live/overcooked.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/overcooked.exemple.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    # Servir les assets statiques directement (perf : décharge le worker Python).
    # Adapter le chemin au dépôt sur le serveur.
    location /static/ {
        alias /home/cesar/python-projects/Overcooked-coop-voice/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:5000/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Montée WebSocket pour Socket.IO
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ping_interval/timeout SocketIO = 60 s : garder le tunnel ouvert bien au-delà.
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_buffering off;          # diffuser les frames state_pong sans bufferiser
    }
}
