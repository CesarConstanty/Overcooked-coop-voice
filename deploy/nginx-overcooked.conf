# Reverse proxy nginx pour Overcooked-coop-voice — vhost HTTP de BOOTSTRAP.
#
# À placer dans /etc/nginx/sites-available/overcooked puis lier dans sites-enabled.
# Remplacer overcooked.exemple.fr par le FQDN réel.
#
# IMPORTANT : ce fichier ne contient QUE le bloc HTTP (port 80), volontairement.
#   `certbot --nginx -d <FQDN>` obtient le certificat ET ajoute lui-même tout le bloc
#   HTTPS (listen 443 ssl, ssl_certificate, include options-ssl-nginx.conf, ssl_dhparam)
#   plus la redirection HTTP->HTTPS. Ne PAS ajouter de directives `ssl_*` ici à la main :
#   `nginx -t` échouerait tant que les fichiers Let's Encrypt n'existent pas.

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name overcooked.exemple.fr;

    client_max_body_size 25m;

    # Servir les assets statiques directement (perf : décharge le worker Python).
    # Adapter le chemin au dépôt sur le serveur (cf. sed dans DEPLOYMENT.md §6).
    location /static/ {
        alias /home/cesar/python-projects/Overcooked-coop-voice/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:5000/healthz;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Montée WebSocket pour Socket.IO
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ping_interval/timeout SocketIO = 60 s : garder le tunnel ouvert bien au-delà.
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_buffering off;          # diffuser les frames state_pong sans bufferiser
    }
}
